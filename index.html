<!doctype html><html lang="ur" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071712"><title>القرآن الكريم • Yasser Al-Dosari</title><link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap');
:root{--bg:#f3fbf6;--card:#ffffff;--green:#3f8f63;--green2:#24704a;--green3:#e5f4eb;--text:#193328;--muted:#6b8277;--line:#3f8f6330}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef9f2 0%,#f9fdfb 45%,#ffffff 100%);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(1100px,94%);margin:auto}.hero{text-align:center;padding:38px 0 22px} .moon{font-size:45px;color:var(--green)}h1{font:700 clamp(36px,8vw,62px) Amiri;margin:0;color:var(--green2)}.sub,.qari{color:var(--muted);font-size:13px}.qari{color:var(--green2);margin-top:7px}.search{position:sticky;top:0;z-index:10;background:#ffffffeb;backdrop-filter:blur(14px);padding:10px 0;border-bottom:1px solid var(--line)}.searchbox{display:flex;gap:8px}.searchbox input{flex:1;background:#fff;border:1px solid var(--line);outline:0;color:var(--text);border-radius:13px;padding:12px 15px}.searchbox button,.filter{border:1px solid var(--line);background:#fff;color:var(--green2);border-radius:12px;padding:8px 13px;cursor:pointer}.filters{display:flex;gap:7px;overflow:auto;margin-top:8px}.filter{white-space:nowrap;color:var(--muted);border-radius:99px}.filter.active{color:var(--green2);border-color:var(--green);background:var(--green3)}.count{color:var(--muted);font-size:12px;margin:15px 2px 9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:125px}.surah{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;min-height:140px;cursor:pointer}.surah:hover{border-color:#3f8f6380;box-shadow:0 8px 25px #3f8f6318}.num{position:absolute;left:11px;top:11px;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:var(--green);font-size:11px;direction:ltr}.fav{position:absolute;right:9px;top:7px;border:0;background:none;color:#62736b;font-size:20px;cursor:pointer}.fav.on{color:var(--green)}.arabic-name{font:400 30px Amiri;color:var(--green2);margin-top:25px}.latin{font-weight:700;font-size:13px;direction:ltr;text-align:right}.meta{color:var(--muted);font-size:10px;margin-top:5px}.player{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(16px);border-top:1px solid var(--line)}.player-in{width:min(1100px,94%);margin:auto;padding:9px 0 11px}.now{display:flex;align-items:center;gap:9px}.cover{width:43px;height:43px;border-radius:11px;background:linear-gradient(135deg,#6db58b,#3f8f63);color:#fff;display:grid;place-items:center;font:24px Amiri}.nowtext{flex:1;min-width:0}.nowtitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowqari{font-size:10px;color:var(--muted)}.controls{display:flex;gap:6px}.ctrl{border:1px solid var(--line);background:#fff;color:var(--green2);width:37px;height:37px;border-radius:50%;cursor:pointer}.ctrl.main{background:var(--green);color:#fff;border:0;width:45px;height:45px}.bar{height:5px;background:#dceee3;border-radius:99px;margin-top:8px;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;background:var(--green)}.times{display:flex;justify-content:space-between;direction:ltr;color:#788b82;font-size:9px}.tools{text-align:left}.tools button{background:none;border:0;color:var(--muted);font-size:10px;cursor:pointer}.modal{position:fixed;inset:0;z-index:50;background:#183d2a66;backdrop-filter:blur(6px);overflow:auto;padding:20px 0}.modal-card{width:min(900px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:110px}.close{float:left;border:1px solid var(--line);background:#fff;color:var(--green2);border-radius:50%;width:36px;height:36px;font-size:22px}.head{text-align:center;padding:10px 35px 20px;border-bottom:1px solid var(--line)}.head .arabic-name{font-size:43px}.meaning{color:var(--green2);font-size:12px}.bismillah{text-align:center;font:30px Amiri;color:var(--green2);margin:20px}.ayah{padding:17px 3px;border-bottom:1px solid #3f8f6316}.ayah-ar{font:400 clamp(25px,4.7vw,36px)/2.05 "Noto Naskh Arabic",Amiri;text-align:right;color:#1c3d2e}.ayah-no{display:inline-grid;place-items:center;width:29px;height:29px;border:1px solid var(--green);border-radius:50%;color:var(--green);font:11px system-ui;margin-left:7px;vertical-align:middle}.ayah-ur{font:18px/1.9 "Noto Naskh Arabic",serif;color:#587166;margin-top:7px}.ayah-actions button{border:1px solid var(--line);background:var(--green3);color:var(--green2);border-radius:8px;padding:6px 9px;font-size:10px;margin:8px 4px 0 0}.loading{text-align:center;color:var(--muted);padding:50px}.error{text-align:center;color:#b94c3e;padding:35px}.toast{position:fixed;z-index:100;bottom:105px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:12px;display:none}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.surah{min-height:135px;padding:13px}.arabic-name{font-size:27px}}@media(max-width:430px){.latin{font-size:11px}.meta{font-size:9px}}
.download-btn{border:1px solid var(--line);background:var(--green3);color:var(--green2);border-radius:10px;padding:7px 10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}.download-btn.done{background:#d9f1e2}.download-btn.busy{opacity:.65;cursor:wait}.surah .download-btn{position:absolute;right:9px;bottom:9px}.head-tools{display:flex;justify-content:center;gap:8px;margin-top:10px}.offline-note{font-size:10px;color:var(--muted);text-align:center;margin-top:5px}</style></head><body>
<header class="hero wrap"><div class="moon">☾</div><h1>القرآن الكريم</h1><div class="sub">مکمل قرآن • 114 سورتیں • اردو ترجمہ</div><div class="qari">🎙️ Yasser Al-Dosari • یاسر الدوسری</div></header>
<section class="search"><div class="wrap"><div class="searchbox"><input id="search" placeholder="سورت تلاش کریں..."><button id="random">🎲</button></div><div class="filters"><button class="filter active" data-f="all">تمام 114</button><button class="filter" data-f="fav">⭐ پسندیدہ</button><button class="filter" data-f="mecca">مکی</button><button class="filter" data-f="madina">مدنی</button></div></div></section>
<main class="wrap"><div class="count" id="count">سورتیں لوڈ ہو رہی ہیں...</div><div class="grid" id="grid"></div></main>
<div class="modal" id="modal" hidden><div class="modal-card"><button class="close" id="close">×</button><div id="reader"></div></div></div><div class="toast" id="toast"></div>
<div class="player"><div class="player-in"><div class="now"><div class="cover">ق</div><div class="nowtext"><div class="nowtitle" id="now">سورت منتخب کریں</div><div class="nowqari">Yasser Al-Dosari</div></div><div class="controls"><button class="ctrl" id="prev">⏮</button><button class="ctrl main" id="play">▶</button><button class="ctrl" id="next">⏭</button></div></div><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="tools"><button id="repeat">🔁 Repeat: Off</button> <button id="speed">1×</button></div></div></div>
<script>
const API="https://quranapi.pages.dev/api";
const OFFLINE_DATA = window.OFFLINE_QURAN_DATA || null;
async function getJSON(url){
  if(OFFLINE_DATA){
    const m=url.match(/\/api\/(surah|)(?:\.json|\/)?$/);
    const n=url.match(/\/api\/(\d+)\.json$/);
    if(url.endsWith("/surah.json") && OFFLINE_DATA.surahs) return OFFLINE_DATA.surahs;
    if(n && OFFLINE_DATA[n[1]]) return OFFLINE_DATA[n[1]];
  }
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}let surahs=[],idx=-1,repeat=false,speed=1;const audio=new Audio();audio.preload="metadata";const $=x=>document.getElementById(x);
function toast(x){$("toast").textContent=x;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",1600)}
function favs(){return JSON.parse(localStorage.getItem("quranFavs")||"[]")}function fav(n){return favs().includes(n)}function toggleFav(n){let a=favs();a=a.includes(n)?a.filter(x=>x!==n):a.concat(n);localStorage.setItem("quranFavs",JSON.stringify(a));render()}
function norm(x){return(x||"").toLowerCase().replace(/[\u064B-\u065F\u0670]/g,"")}
function list(){
  let q=norm($("search").value);
  let f=document.querySelector(".filter.active").dataset.f;
  return surahs.filter(s=>{
    const place=norm(s.revelationPlace);
    const matchesSearch=!q ||
      norm(s.surahName).includes(q) ||
      norm(s.surahNameArabic).includes(q) ||
      norm(s.surahNameTranslation).includes(q) ||
      String(s.surahNo).includes(q);

    const matchesFilter =
      f==="all" ||
      (f==="fav" && fav(s.surahNo)) ||
      (f==="mecca" && (place==="mecca" || place==="makkah" || place==="macca")) ||
      (f==="madina" && (place==="madina" || place==="medina" || place==="madinah"));

    return matchesSearch && matchesFilter;
  });
}
function render(){
  let a=list();$("count").textContent=a.length+" سورتیں";
  $("grid").innerHTML=a.length?a.map(s=>`<article class="surah" onclick="openSurah(${Number(s.surahNo)})"><button class="fav ${fav(s.surahNo)?"on":""}" onclick="event.stopPropagation();toggleFav(${s.surahNo})">${fav(s.surahNo)?"★":"☆"}</button><div class="num">${s.surahNo}</div><div class="arabic-name">${s.surahNameArabic}</div><div class="latin">${s.surahName}</div><div class="meta">${s.surahNameTranslation} • ${/^(mecca|makkah|macca)$/i.test(s.revelationPlace||"")?"مکی":"مدنی"} • ${s.totalAyah} آیات</div><button class="download-btn" id="dl-${s.surahNo}" onclick="event.stopPropagation();downloadSurah(${s.surahNo})">⬇ Download</button></article>`).join(""):'<div class="error">کوئی سورت نہیں ملی۔</div>';
  a.forEach(async s=>{if(await downloaded(s.surahNo)){const b=$("dl-"+s.surahNo);if(b){b.classList.add("done");b.textContent="✓ Offline"}}});
}

async function load(){
  try{
    let raw=await getJSON(API+"/surah.json");
    // Support both the documented quranapi.pages.dev fields and alternate metadata keys.
    if(!Array.isArray(raw) && Array.isArray(raw.surahs)) raw=raw.surahs;
    surahs=(Array.isArray(raw)?raw:[]).map((s,i)=>({
      ...s,
      surahNo:Number(s.surahNo ?? s.surahNumber ?? s.number ?? s.sequence ?? s.id ?? (i+1))
    })).filter(s=>Number.isInteger(s.surahNo) && s.surahNo>=1 && s.surahNo<=114);
    surahs.sort((a,b)=>a.surahNo-b.surahNo);
    render();
  }catch(e){
    console.error(e);
    $("grid").innerHTML='<div class="error">انٹرنیٹ/API دستیاب نہیں۔ براہِ کرم دوبارہ کوشش کریں۔</div>';
  }
}
async function openSurah(n){
  n=Number(n);
  if(!Number.isInteger(n) || n<1 || n>114){toast("سورت نمبر درست نہیں");return}
  idx=n-1;
  $("modal").hidden=false;
  document.body.style.overflow="hidden";
  $("reader").innerHTML='<div class="loading">سورت لوڈ ہو رہی ہے…</div>';
  try{
    let d=await getJSON(API+"/"+n+".json");
    $("reader").innerHTML=`<div class="head"><div class="arabic-name">${d.surahNameArabic}</div><div class="latin" style="text-align:center">${d.surahName}</div><div class="meaning">${d.surahNameTranslation} • ${/^(mecca|makkah|macca)$/i.test(d.revelationPlace||"")?"مکی":"مدنی"} • ${d.totalAyah} آیات</div><div class="head-tools"><button class="download-btn ${downloaded(n)?"done":""}" id="modalDownload" onclick="downloadSurah(${n})">${downloaded(n)?"✓ Offline Available":"⬇ Download Surah for Offline"}</button></div><div class="offline-note">ایک بار download کرنے کے بعد یہ سورت internet کے بغیر بھی چل سکتی ہے۔</div></div>${n!==9?'<div class="bismillah">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>':''}${d.arabic1.map((a,i)=>`<div class="ayah"><div class="ayah-ar"><span class="ayah-no">${i+1}</span>${a}</div><div class="ayah-ur">${d.urdu?.[i]||""}</div><div class="ayah-actions"><button onclick="playAyah(${n},${i+1})">▶ آیت سنیں</button><button onclick='copyText(${JSON.stringify(a)})'>📋 عربی کاپی</button></div></div>`).join("")}`;playSurah(n)}catch(e){$("reader").innerHTML='<div class="error">سورت لوڈ نہیں ہو سکی۔</div>'}}
function close(){ $("modal").hidden=true;document.body.style.overflow="" }$("close").onclick=close;$("modal").onclick=e=>{if(e.target===$("modal"))close()};
const DB_NAME="quranOfflineDB", DB_VERSION=1, STORE="audio";
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  }); return dbPromise;
}
async function getOffline(n){
  try{const db=await openDB();return await new Promise((res,rej)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).get(String(n));r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}
}
async function putOffline(n,blob){
  const db=await openDB(); return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).put(blob,String(n));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})
}
async function downloaded(n){ return !!(await getOffline(n)) }
function audioUrl(n){
  return "https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/"+String(n).padStart(3,"0")+".mp3";
}
async function sourceFor(n){
  const blob=await getOffline(n);
  if(blob) return URL.createObjectURL(blob);
  return audioUrl(n);
}
async function downloadSurah(n){
  const btn=document.getElementById("dl-"+n)||document.getElementById("modalDownload");
  if(await downloaded(n)){toast("یہ سورت پہلے ہی offline محفوظ ہے ✓");return}
  if(btn){btn.classList.add("busy");btn.textContent="⏳ Downloading..."}
  try{
    const url=audioUrl(n);
    const r=await fetch(url,{mode:"cors",cache:"force-cache"});
    if(!r.ok) throw new Error("download failed "+r.status);
    const blob=await r.blob();
    if(blob.size<10000) throw new Error("invalid audio");
    await putOffline(n,blob);
    toast("سورت offline محفوظ ہو گئی ✓");
    if(btn){btn.classList.remove("busy");btn.classList.add("done");btn.textContent="✓ Offline"}
    render();
    if(!$("modal").hidden) {
      const md=$("modalDownload"); if(md){md.classList.add("done");md.textContent="✓ Offline Available"}
    }
  }catch(e){
    console.error(e);
    toast("Download نہیں ہو سکا۔ Internet/CORS چیک کریں۔");
    if(btn){btn.classList.remove("busy");btn.textContent="⬇ Download Surah for Offline"}
  }
}
async function playSurah(n){
  n=Number(n); if(n<1||n>114)return;
  idx=n-1;
  let s=surahs[idx];
  $("now").textContent=n+". "+s.surahNameArabic+" — "+s.surahName;
  $("play").textContent="❚❚";
  localStorage.setItem("lastSurah",n);
  try{
    const src=await sourceFor(n);
    if(audio.src.startsWith("blob:")) URL.revokeObjectURL(audio.src);
    audio.src=src;
    audio.playbackRate=speed;
    await audio.play();
  }catch(e){
    console.error(e); $("play").textContent="▶";
    toast("اس سورت کی آڈیو نہیں چل سکی");
  }
}
async function playAyah(n,a){
  try{
    const url="https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/"+String(n).padStart(3,"0")+String(a).padStart(3,"0")+".mp3";
    audio.src=url;
    audio.playbackRate=speed;
    await audio.play();
    $("now").textContent=surahs[n-1].surahNameArabic+" • آیت "+a;
    $("play").textContent="❚❚";
  }catch(e){console.error(e);$("play").textContent="▶";toast("آیت کی آڈیو لوڈ نہیں ہو سکی")}
}
$("play").onclick=async ()=>{
  if(audio.src){
    if(audio.paused){
      try{await audio.play();$("play").textContent="❚❚"}catch{toast("آڈیو چل نہیں سکی")}
    }else{
      audio.pause();$("play").textContent="▶";
    }
  }else playSurah(idx>=0?idx+1:1);
};$("prev").onclick=()=>idx>0&&playSurah(idx);$("next").onclick=()=>idx<113&&playSurah(idx+2);
$("repeat").onclick=()=>{repeat=!repeat;$("repeat").textContent=repeat?"🔁 Repeat: On":"🔁 Repeat: Off"};$("speed").onclick=()=>{speed=speed===1?1.25:speed===1.25?1.5:speed===1.5?.75:1;audio.playbackRate=speed;$("speed").textContent=speed+"×"};
audio.ontimeupdate=()=>{if(audio.duration)$("fill").style.width=audio.currentTime/audio.duration*100+"%";$("cur").textContent=fmt(audio.currentTime)};audio.onloadedmetadata=()=>{$("dur").textContent=fmt(audio.duration)};audio.onended=()=>repeat?(audio.currentTime=0,audio.play()):idx<113?playSurah(idx+2):$("play").textContent="▶";audio.onerror=()=>{console.error("Audio error",audio.src);$("play").textContent="▶";toast("آڈیو سرور سے نہیں چل سکی")};
$("bar").onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration}};function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}async function copyText(x){try{await navigator.clipboard.writeText(x);toast("کاپی ہو گیا")}catch{}}
$("search").oninput=render;document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});$("random").onclick=()=>surahs.length&&openSurah(Math.floor(Math.random()*114)+1);document.addEventListener("keydown",e=>e.key==="Escape"&&!$("modal").hidden&&close());
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}
load();
</script></body></html>
